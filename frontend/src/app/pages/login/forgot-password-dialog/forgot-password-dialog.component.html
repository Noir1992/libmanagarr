<h2 mat-dialog-title class="dialog-title">{{ title() }}</h2>

<mat-dialog-content class="dialog-content">
  <p>{{ message() }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" mat-stroked-button class="secondary-button" (click)="close()">{{ closeLabel() }}</button>
</mat-dialog-actions>
