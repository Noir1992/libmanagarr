<button
  mat-icon-button
  type="button"
  class="sort-toggle-button"
  [matMenuTriggerFor]="sortMenu"
  [attr.aria-label]="labels().title"
  [title]="labels().title"
>
  <span class="material-symbols-outlined" aria-hidden="true">sort</span>
</button>
<mat-menu #sortMenu="matMenu" xPosition="before">
  @for (option of options(); track option.value) {
    <button mat-menu-item type="button" class="sort-menu-item" (click)="onFieldPicked(option.value)">
      <span>{{ option.label }}</span>
      @if (option.value === sortField()) {
        <span class="material-symbols-outlined sort-option-icon" aria-hidden="true">{{ directionIcon() }}</span>
      }
    </button>
  }
</mat-menu>
