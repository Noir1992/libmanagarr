name: E2E tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2
      - uses: actions/setup-node@v5
        timeout-minutes: 3
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - uses: docker/setup-buildx-action@v4
        timeout-minutes: 3
      - name: Install test tools
        timeout-minutes: 3
        working-directory: tests/e2e
        run: npm ci
      - name: Validate test infrastructure
        timeout-minutes: 3
        working-directory: tests/e2e
        run: |
          npm test
          npm run typecheck
      - name: Lint E2E code
        timeout-minutes: 3
        working-directory: tests/e2e
        run: npm run lint
      - name: Check E2E formatting
        timeout-minutes: 3
        working-directory: tests/e2e
        run: npm run format:check
      - name: Build candidate image
        timeout-minutes: 15
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: libmanagarr:e2e
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Read pinned browser runner image
        id: runner
        run: node -e 'console.log("image=" + require("./tests/e2e/versions.json").images.runner)' >> "$GITHUB_OUTPUT"
      - name: Build cached browser runner
        timeout-minutes: 10
        uses: docker/build-push-action@v7
        with:
          context: tests/e2e
          file: tests/e2e/Dockerfile.runner
          build-args: RUNNER_IMAGE=${{ steps.runner.outputs.image }}
          load: true
          tags: libmanagarr:e2e-runner
          platforms: linux/amd64
          cache-from: type=gha,scope=e2e-runner
          cache-to: type=gha,scope=e2e-runner,mode=max
      - name: Browser tests against candidate
        timeout-minutes: 30
        working-directory: tests/e2e
        env:
          E2E_APP_IMAGE: libmanagarr:e2e
          E2E_RUNNER_IMAGE: libmanagarr:e2e-runner
        run: npm run e2e -- --suite full
      - name: Write phase timings to job summary
        if: always()
        working-directory: tests/e2e
        run: node scripts/report-timings.mjs
      - name: Export tested image
        timeout-minutes: 3
        run: docker save libmanagarr:e2e -o /tmp/tested-image.tar
      - uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: tested-image
          path: /tmp/tested-image.tar
          retention-days: 1
          compression-level: 0
      - name: Upload diagnostics
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: tests/e2e/artifacts/
          retention-days: 7
          if-no-files-found: warn
