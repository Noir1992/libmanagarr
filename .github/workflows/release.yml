name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/noir1992/libmanagarr

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test backend/LibManagarr.Backend.sln -c Release --nologo -v minimal

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The npm bundled with node 22 (npm 10) cannot read this lockfile's nested
      # overrides and fails `npm ci` with "Missing: minimatch@10.2.6 from lock file".
      # Pin the same version the frontend declares (packageManager) and the Dockerfile installs.
      - run: npm install -g npm@11.12.1
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      # The specs run in headless Chromium, so the browser binary has to exist before the first run.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci

  release-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      # The release version (without the `v` prefix) becomes the assembly version the
      # running instance compares against the published GitHub releases.
      - name: Strip the `v` prefix from the release tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  e2e:
    needs: [release-version]
    uses: ./.github/workflows/e2e.yml
    with:
      image-version: ${{ needs.release-version.outputs.version }}

  release-image:
    name: Publish tested release image
    needs: [release-version, backend-tests, frontend-tests, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: tested-image
          path: /tmp/tested-image
      - name: Load tested image
        run: docker load -i /tmp/tested-image/tested-image.tar
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # Always publish the exact version, including four-part calendar revisions such as 26.11.19.1.
          # SemVer-compatible versions also retain their major/minor aliases.
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.release-version.outputs.version }},priority=1000
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{major}},enable=${{ !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [[ -z "$IMAGE_TAGS" ]]; then
            echo "::error::No image tags were generated for release '$GITHUB_REF_NAME'."
            exit 1
          fi
          while IFS= read -r tag; do
            docker tag libmanagarr:e2e "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
