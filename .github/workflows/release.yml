name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/noir1992/libmanagarr

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test backend/LibManagarr.Backend.sln -c Release --nologo -v minimal

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run test:ci

  release-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      # The release version (without the `v` prefix) becomes the assembly version the
      # running instance compares against the published GitHub releases.
      - name: Strip the `v` prefix from the release tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  e2e:
    needs: [release-version]
    uses: ./.github/workflows/e2e.yml
    with:
      image-version: ${{ needs.release-version.outputs.version }}

  release-image:
    name: Publish tested release image
    needs: [backend-tests, frontend-tests, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: tested-image
          path: /tmp/tested-image
      - name: Load tested image
        run: docker load -i /tmp/tested-image/tested-image.tar
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # From tag v1.2.0 -> :1.2.0, :1.2, :1 and :latest; prereleases get -rc variants instead of :latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag libmanagarr:e2e "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
